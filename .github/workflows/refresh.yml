name: Refresh data

on:
  schedule:
    # Tuesday 06:00 Pacific. Cron is UTC: 13:00 UTC during PDT, 14:00 UTC during PST.
    # Both are listed so the job fires at 6am Pacific year-round (one run is a harmless duplicate).
    - cron: "0 13 * * 2"
    - cron: "0 14 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = current)"
        required: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            nflreadr
            dplyr
            tidyr
            purrr
            jsonlite

      # Historical seasons never change: keep the raw downloads and career caches between runs.
      - name: Restore historical cache
        uses: actions/cache@v4
        with:
          path: cache
          key: nflverse-cache-v1-${{ github.run_id }}
          restore-keys: |
            nflverse-cache-v1-

      - name: Build data
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            Rscript R/build.R --season "${{ github.event.inputs.season }}"
          else
            Rscript R/build.R
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
